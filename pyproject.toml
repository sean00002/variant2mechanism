[project]
name = "variant2mechanism"
version = "0.1.0"
description = "Ranked, testable TF mechanisms for non-coding variants, with every claim tied to logged evidence"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Shengyu Li", email = "seanlishengyu@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=1.26",
    "pandas>=2.2",
    "pydantic>=2.14.1",
    "pyyaml>=6.0",
    "qbic-selex==1.0.0",
    "requests>=2.34.2",
    "scipy>=1.11",
]

[project.scripts]
v2m = "variant2mechanism.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "data: needs the local data/ folder (skipped when it is missing, as in CI)",
    "cluster: runs jobs on the Duke CS cluster (skipped unless QBIC_CLUSTER=1)",
    "live: calls real APIs or models (skipped unless V2M_LIVE=1)",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = ["UP031"]   # %-formatting reads better than f-strings in brace-heavy GraphQL queries
