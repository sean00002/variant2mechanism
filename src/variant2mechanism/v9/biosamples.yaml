# v9 biosample identities (SPEC 3.4 and 13.13). Owned by v9; context/biosample_match.yaml is v8's and is only read.
#
# Built on 8 Nov 2026 from local files, without network access:
#   - data/screen/core_biosamples.json: the 170 SCREEN core-collection columns, 72 distinct ENCODE term names
#     (every one is a record below, with in_screen_core: true);
#   - data/reference/depmap/DepMap_Model.csv: DepMap ModelID and RRID (Cellosaurus) for the cell lines (the file
#     states no DepMap release);
#   - context/biosample_match.yaml: the v8 DepMap line names and its declared proxy (Hep 3B2.1-7 -> HepG2).
# ENCODE ontology term IDs are not in the local data (the cached ENCODE search holds term names only), so `ontology`
# stays null until they are fetched. ENCODE cell-type terms do not say whether the cells were primary or differentiated
# in vitro, so their kind is unknown.
#
# Fields: name (the normalised biosample name), kind (cell_line | primary_cell | tissue | organism | unknown), tissue
# (organ-level, lower case; two biosamples sharing it are proxies of each other, except two distinct cell lines, which
# are proxies only when declared), organ (true: the name is a whole organ, so its scope carries the tissue only),
# aliases, depmap, rrid, ontology, in_screen_core, proxies (declared proxies beyond a shared tissue), genotypes (at a
# variant, when a source states it), note.
# Matching normalises names by removing spaces, hyphens and underscores and ignoring case.

version: "2026-11-08"

tissues:          # organ-level tissue -> keywords found in free-text labels (one tissue must match, else none)
