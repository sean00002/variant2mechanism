# expression_context -> ENCODE biosample names (spec 3, section 1.3). Keys: a DepMap ModelID, a DepMap subtype, a GTEx
# tissue, or none. An empty list means no ENCODE biosample matches, so no peak counts as "bound here". A context that
# is not listed is reported in the occupancy summary and treated as matching nothing until it is added here.

DepMap:ACH-000971: {line: HCT 116, biosamples: [HCT116]}
DepMap:ACH-000019: {line: MCF7, biosamples: [MCF-7]}
DepMap:ACH-000149: {line: SK-N-SH, biosamples: [SK-N-SH]}
DepMap:ACH-000625: {line: Hep 3B2.1-7, biosamples: [HepG2], proxy: HepG2 stands in for Hep 3B2.1-7 (both liver cancer lines)}
DepMap:ACH-000551: {line: K-562, biosamples: [K562]}
DepMap:ACH-000977: {line: LNCaP clone FGC, biosamples: [LNCaP clone FGC, LNCaP]}
DepMap:subtype=Glioblastoma: {biosamples: []}
GTEx:Adipose - Subcutaneous: {biosamples: []}
none: {biosamples: []}
