<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 170" width="960" height="170" role="img"
     aria-labelledby="banner-title banner-desc" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="banner-title">variant2mechanism</title>
  <desc id="banner-desc">How could this variant lead to that trait? A chain from a variant through transcription
    factor binding, a regulatory element and a target gene to a trait.</desc>
  <rect width="960" height="170" rx="16" fill="#d8eefe"/>

  <text x="40" y="76" font-size="38" font-weight="800" fill="#094067" letter-spacing="-0.6">variant2mechanism</text>
  <text x="41" y="108" font-size="16.5" font-weight="600" fill="#094067">How could this variant lead to that trait?</text>
  <text x="41" y="132" font-size="13.5" fill="#5f6c7b">Small claims, each checked against databases, models and papers.</text>

  <!-- the chain -->
  <line x1="590" y1="78" x2="910" y2="78" stroke="#3da9fc" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="590" cy="78" r="11" fill="#094067"/>
  <circle cx="670" cy="78" r="10" fill="#fffffe" stroke="#094067" stroke-width="2.5"/>
  <circle cx="750" cy="78" r="10" fill="#fffffe" stroke="#094067" stroke-width="2.5"/>
  <circle cx="830" cy="78" r="10" fill="#fffffe" stroke="#094067" stroke-width="2.5"/>
  <circle cx="910" cy="78" r="11" fill="#ef4565"/>
  <g font-size="12" fill="#094067" text-anchor="middle">
    <text x="590" y="112">variant</text>
    <text x="670" y="112">TF</text>
    <text x="750" y="112">element</text>
    <text x="830" y="112">gene</text>
    <text x="910" y="112">trait</text>
  </g>
</svg>
