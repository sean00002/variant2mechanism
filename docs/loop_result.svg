<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 524" width="960" height="524" role="img"
     aria-labelledby="lr-title lr-desc" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="lr-title">The loop at rs9349379: a remembered name settles a tie</title>
  <desc id="lr-desc">The variant rs9349379 was run twice. After the first reading three chains tie for first and
    none names a transcription factor. In both runs code makes the same six searches, for the tied genes and for
    what four reviews cite: 20 new articles, 2 read, 3 experiments filed, none counting for a claim, and the three
    chains still tie. In the run with the planner, the planner also names MEF2A and EDN1 from its memory, and code
    uses them as search terms only: 5 new articles, 2 read, 5 experiments filed, 2 counting for a claim, and one
    chain leads, MEF2 to PHACTR1. Both records that count come from one article, PMID 25838425: a gel-shift assay
    in which MEF2 binds the A allele and not the G allele, and a 34-base-pair deletion that removes the variant and
    lowers PHACTR1 expression by 35%. Over all eight variants run with the planner, the loop listed 95 new
    articles: 66 hold no passage on the variant in the text retrieved, 19 are reviews and 10 were read. The 10
    gave 12 experiments that passed code's checks, and 2 count for a claim, both at rs9349379.</desc>
  <defs>
    <marker id="lr-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#90b4ce"/>
    </marker>
    <clipPath id="lr-bar"><rect x="30" y="420" width="900" height="30" rx="6"/></clipPath>
  </defs>

  <rect x="0.5" y="0.5" width="959" height="523" rx="14" fill="#fffffe" stroke="#d8eefe"/>
  <text x="30" y="40" font-size="18" font-weight="700" fill="#094067">The loop at rs9349379: a remembered name settles a tie</text>
  <text x="30" y="62" font-size="13" fill="#5f6c7b">One variant, run twice. Code's menu is the same in both runs. The planner adds two names from its memory</text>

  <!-- legend -->
  <g font-size="12.5" fill="#5f6c7b">
    <circle cx="742" cy="35" r="7" fill="#3da9fc"/><text x="756" y="39.5">code</text>
    <circle cx="812" cy="35" r="7" fill="#ef4565"/><text x="826" y="39.5">a language model</text>
  </g>

  <!-- the first reading -->
  <text x="30" y="92" font-size="10.5" font-weight="700" fill="#5f6c7b" letter-spacing="0.9">FIRST READING</text>
  <rect x="30" y="100" width="156" height="188" rx="12" fill="#fffffe" stroke="#90b4ce" stroke-width="1.5"/>
  <text x="44" y="130" font-size="15.5" font-weight="700" fill="#094067">3 chains tie</text>
  <g font-size="12.5" fill="#094067">
    <text x="44" y="150">for first. None</text>
    <text x="44" y="167">names a TF.</text>
  </g>
  <text x="44" y="196" font-size="10.5" font-weight="700" fill="#5f6c7b" letter-spacing="0.9">THE TIED GENES</text>
  <g font-size="12" fill="#094067" text-anchor="middle">
    <rect x="44" y="204" width="128" height="20" rx="10" fill="#d8eefe"/><text x="108" y="218">PHACTR1</text>
    <rect x="44" y="228" width="128" height="20" rx="10" fill="#d8eefe"/><text x="108" y="242">TBC1D7</text>
    <rect x="44" y="252" width="128" height="20" rx="10" fill="#d8eefe"/><text x="108" y="266">ENSG00000272379</text>
  </g>

  <!-- arrows -->
  <g stroke="#90b4ce" stroke-width="2" fill="none">
    <line x1="188" y1="142" x2="202" y2="142" marker-end="url(#lr-arrow)"/>
    <line x1="388" y1="142" x2="402" y2="142" marker-end="url(#lr-arrow)"/>
    <line x1="548" y1="142" x2="562" y2="142" marker-end="url(#lr-arrow)"/>
    <line x1="744" y1="142" x2="758" y2="142" marker-end="url(#lr-arrow)"/>
    <line x1="188" y1="246" x2="202" y2="246" marker-end="url(#lr-arrow)"/>
    <line x1="388" y1="246" x2="402" y2="246" marker-end="url(#lr-arrow)"/>
    <line x1="548" y1="246" x2="562" y2="246" marker-end="url(#lr-arrow)"/>
    <line x1="744" y1="246" x2="758" y2="246" marker-end="url(#lr-arrow)"/>
  </g>

  <!-- lane 1: code's menu, in both runs -->
  <g>
    <rect x="206" y="100" width="180" height="84" rx="12" fill="#fffffe" stroke="#3da9fc" stroke-width="1.8"/>
    <text x="220" y="120" font-size="10.5" font-weight="700" fill="#5f6c7b" letter-spacing="0.9">CODE, IN BOTH RUNS</text>
    <text x="220" y="142" font-size="14" font-weight="700" fill="#094067">6 searches</text>
    <text x="220" y="160" font-size="12.5" fill="#094067">the tied genes, and what</text>
    <text x="220" y="176" font-size="12.5" fill="#094067">4 reviews cite</text>

    <rect x="406" y="100" width="140" height="84" rx="12" fill="#fffffe" stroke="#3da9fc" stroke-width="1.8"/>
    <text x="420" y="120" font-size="10.5" font-weight="700" fill="#5f6c7b" letter-spacing="0.9">CODE SEARCHES</text>
    <text x="420" y="142" font-size="14" font-weight="700" fill="#094067">20 articles</text>
    <text x="420" y="160" font-size="12.5" fill="#094067">new to the run</text>

    <rect x="566" y="100" width="176" height="84" rx="12" fill="#fffffe" stroke="#ef4565" stroke-width="1.8"/>
    <text x="580" y="120" font-size="10.5" font-weight="700" fill="#5f6c7b" letter-spacing="0.9">THE READER READS 2</text>
    <text x="580" y="142" font-size="14" font-weight="700" fill="#094067">3 experiments filed</text>
    <text x="580" y="160" font-size="12.5" fill="#094067">and none counts</text>

    <rect x="762" y="100" width="168" height="84" rx="12" fill="#fffffe" stroke="#90b4ce" stroke-width="1.5"/>
    <text x="776" y="120" font-size="10.5" font-weight="700" fill="#5f6c7b" letter-spacing="0.9">CODE'S ORDER ALONE</text>
    <text x="776" y="143" font-size="14" font-weight="700" fill="#094067">3 chains still tie</text>
    <text x="776" y="161" font-size="12.5" fill="#5f6c7b">no TF named</text>
  </g>

  <!-- lane 2: what the planner adds -->
  <g>
    <rect x="206" y="204" width="180" height="84" rx="12" fill="#fffffe" stroke="#ef4565" stroke-width="1.8"/>
    <text x="220" y="224" font-size="10.5" font-weight="700" fill="#5f6c7b" letter-spacing="0.9">THE PLANNER ADDS</text>
    <text x="220" y="246" font-size="14" font-weight="700" fill="#094067">2 names from memory</text>
    <text x="220" y="264" font-size="12.5" fill="#094067">MEF2A and EDN1, used</text>
    <text x="220" y="280" font-size="12.5" fill="#094067">as search terms only</text>

    <rect x="406" y="204" width="140" height="84" rx="12" fill="#fffffe" stroke="#3da9fc" stroke-width="1.8"/>
    <text x="420" y="224" font-size="10.5" font-weight="700" fill="#5f6c7b" letter-spacing="0.9">CODE SEARCHES</text>
    <text x="420" y="246" font-size="14" font-weight="700" fill="#094067">5 articles</text>
    <text x="420" y="264" font-size="12.5" fill="#094067">new to the run</text>

    <rect x="566" y="204" width="176" height="84" rx="12" fill="#fffffe" stroke="#ef4565" stroke-width="1.8"/>
    <text x="580" y="224" font-size="10.5" font-weight="700" fill="#5f6c7b" letter-spacing="0.9">THE READER READS 2</text>
    <text x="580" y="246" font-size="14" font-weight="700" fill="#094067">5 experiments filed</text>
    <text x="580" y="264" font-size="12.5" fill="#094067">2 count for a claim</text>

    <rect x="762" y="204" width="168" height="84" rx="12" fill="#094067"/>
    <text x="776" y="224" font-size="10.5" font-weight="700" fill="#d8eefe" letter-spacing="0.9">WITH THE PLANNER</text>
    <text x="776" y="247" font-size="14.5" font-weight="700" fill="#fffffe">MEF2 → PHACTR1</text>
    <text x="776" y="265" font-size="12.5" fill="#d8eefe">one chain leads</text>
  </g>

  <!-- the two records that count -->
  <text x="30" y="318" font-size="10.5" font-weight="700" fill="#5f6c7b" letter-spacing="0.9">THE 2 RECORDS THAT COUNT, FROM ONE ARTICLE THE NAME MEF2A FOUND (PMID 25838425)</text>
  <rect x="30" y="328" width="440" height="52" rx="10" fill="#fffffe" stroke="#ef4565" stroke-width="1.4"/>
  <text x="44" y="348" font-size="11" font-weight="700" fill="#ef4565" letter-spacing="0.8">TF BINDING: THE ALLELES DIFFER</text>
  <text x="44" y="367" font-size="12.5" fill="#094067">Gel-shift assay: MEF2 binds the A allele and not the G allele</text>
  <rect x="490" y="328" width="440" height="52" rx="10" fill="#fffffe" stroke="#ef4565" stroke-width="1.4"/>
  <text x="504" y="348" font-size="11" font-weight="700" fill="#ef4565" letter-spacing="0.8">TARGET GENE: THE PARTS ARE IN PLACE</text>
  <text x="504" y="367" font-size="12.5" fill="#094067">A 34-bp deletion that removes the variant: 35% less PHACTR1</text>

  <!-- all eight variants: where the new articles went -->
  <text x="30" y="410" font-size="10.5" font-weight="700" fill="#5f6c7b" letter-spacing="0.9">ALL 8 VARIANTS, WITH THE PLANNER: WHAT BECAME OF THE 95 NEW ARTICLES</text>
  <g clip-path="url(#lr-bar)">
    <rect x="30" y="420" width="622" height="30" fill="#d8eefe"/>
    <rect x="654" y="420" width="180" height="30" fill="#90b4ce"/>
    <rect x="836" y="420" width="94" height="30" fill="#094067"/>
  </g>
  <g font-size="12.5">
    <text x="44" y="439.5" fill="#094067">66 hold no passage on the variant in the text retrieved (29 are abstracts only)</text>
    <text x="744" y="439.5" fill="#094067" text-anchor="middle">19 reviews</text>
    <text x="883" y="439.5" fill="#fffffe" font-weight="700" text-anchor="middle">10 read</text>
  </g>
  <text x="930" y="470" font-size="12.5" fill="#5f6c7b" text-anchor="end">The 10 gave 12 experiments that passed code's checks. 2 count for a claim, both at rs9349379.</text>

  <rect x="30" y="486" width="64" height="20" rx="10" fill="#094067"/>
  <text x="62" y="500" font-size="10.5" font-weight="700" fill="#fffffe" text-anchor="middle" letter-spacing="0.8">RESULT</text>
  <text x="104" y="500.5" font-size="12.5" fill="#5f6c7b">One table of eight changed. At the other seven, nothing the loop read counts for a claim.</text>
</svg>
