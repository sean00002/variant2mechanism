<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 396" width="960" height="396" role="img"
     aria-labelledby="chain-title chain-desc" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="chain-title">One chain: eight claims, three kinds of evidence</title>
  <desc id="chain-desc">The leading chain for rs339331. Four steps: TF binding (HOXB13's group), regulatory activity
    (one element), target gene (RFX6) and trait (prostate carcinoma). Each step has two claims, that the alleles
    differ and that the parts are in place, and each claim has three cells: a database record, a model prediction
    and the literature. Regulatory activity has no evidence that the alleles differ, so it is the weakest link.</desc>
  <defs>
    <marker id="chain-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#90b4ce"/>
    </marker>
    <!-- a card: outline, header band, column letters, row labels, divider and the footer label -->
    <g id="card">
      <rect width="180" height="228" rx="12" fill="#fffffe" stroke="#90b4ce" stroke-width="1.3"/>
      <path d="M 1 13 a 12 12 0 0 1 12 -12 h 154 a 12 12 0 0 1 12 12 v 24 h -178 z" fill="#d8eefe"/>
      <g font-size="11" font-weight="700" fill="#5f6c7b" text-anchor="middle">
        <text x="108" y="108">D</text><text x="136" y="108">M</text><text x="164" y="108">L</text>
      </g>
      <g font-size="12.5" fill="#094067">
        <text x="14" y="132">alleles differ</text><text x="14" y="160">in place</text>
      </g>
      <line x1="14" y1="178" x2="166" y2="178" stroke="#d8eefe" stroke-width="1.5"/>
      <text x="14" y="198" font-size="11" fill="#5f6c7b">strongest evidence</text>
    </g>
    <circle id="yes" r="6.5" fill="#3da9fc" stroke="#094067" stroke-width="1.2"/>
    <circle id="no" r="6" fill="#fffffe" stroke="#90b4ce" stroke-width="1.7"/>
    <line id="none" x1="-5.5" y1="0" x2="5.5" y2="0" stroke="#90b4ce" stroke-width="2.2" stroke-linecap="round"/>
  </defs>

  <rect x="0.5" y="0.5" width="959" height="395" rx="14" fill="#fffffe" stroke="#d8eefe"/>
  <text x="30" y="40" font-size="18" font-weight="700" fill="#094067">One chain: eight claims, three kinds of evidence</text>
  <text x="30" y="62" font-size="13" fill="#5f6c7b">The leading chain for rs339331, a prostate cancer risk variant</text>

  <!-- the variant -->
  <rect x="30" y="166" width="98" height="60" rx="30" fill="#094067"/>
  <text x="79" y="192" font-size="13.5" font-weight="700" fill="#fffffe" text-anchor="middle">rs339331</text>
  <text x="79" y="210" font-size="12" fill="#d8eefe" text-anchor="middle">T or C</text>
  <line x1="130" y1="196" x2="146" y2="196" stroke="#90b4ce" stroke-width="2" marker-end="url(#chain-arrow)"/>

  <!-- step 1: TF binding -->
  <g transform="translate(150 84)">
    <use href="#card"/>
    <text x="14" y="25" font-size="14.5" font-weight="700" fill="#094067">1  TF binding</text>
    <text x="14" y="62" font-size="13.5" font-weight="700" fill="#094067">HOXB13's group</text>
    <text x="14" y="80" font-size="11.5" fill="#5f6c7b">four TFs, one binding model</text>
    <use href="#yes" x="108" y="128"/><use href="#yes" x="136" y="128"/><use href="#yes" x="164" y="128"/>
    <use href="#yes" x="108" y="156"/><use href="#none" x="136" y="156"/><use href="#yes" x="164" y="156"/>
    <text x="14" y="215" font-size="13" font-weight="700" fill="#094067">an assay of the alleles</text>
  </g>
  <line x1="332" y1="196" x2="348" y2="196" stroke="#90b4ce" stroke-width="2" marker-end="url(#chain-arrow)"/>

  <!-- step 2: regulatory activity, the weakest link -->
  <g transform="translate(352 84)">
    <use href="#card"/>
    <rect width="180" height="228" rx="12" fill="none" stroke="#ef4565" stroke-width="2"/>
    <text x="14" y="25" font-size="14.5" font-weight="700" fill="#094067">2  Regulatory activity</text>
    <text x="14" y="62" font-size="13.5" font-weight="700" fill="#094067">one regulatory element</text>
    <text x="14" y="80" font-size="11.5" fill="#5f6c7b">EH38E2496909</text>
    <use href="#no" x="108" y="128"/><use href="#none" x="136" y="128"/><use href="#no" x="164" y="128"/>
    <use href="#yes" x="108" y="156"/><use href="#none" x="136" y="156"/><use href="#no" x="164" y="156"/>
    <text x="14" y="215" font-size="13" font-weight="700" fill="#094067">none</text>
  </g>
  <text x="442" y="333" font-size="12.5" font-weight="700" fill="#ef4565" text-anchor="middle">the weakest link</text>
  <line x1="534" y1="196" x2="550" y2="196" stroke="#90b4ce" stroke-width="2" marker-end="url(#chain-arrow)"/>

  <!-- step 3: target gene -->
  <g transform="translate(554 84)">
    <use href="#card"/>
    <text x="14" y="25" font-size="14.5" font-weight="700" fill="#094067">3  Target gene</text>
    <text x="14" y="62" font-size="13.5" font-weight="700" fill="#094067">RFX6</text>
    <text x="14" y="80" font-size="11.5" fill="#5f6c7b">its RNA changes with the allele</text>
    <use href="#yes" x="108" y="128"/><use href="#none" x="136" y="128"/><use href="#yes" x="164" y="128"/>
    <use href="#no" x="108" y="156"/><use href="#none" x="136" y="156"/><use href="#yes" x="164" y="156"/>
    <text x="14" y="215" font-size="13" font-weight="700" fill="#094067">an edit of the allele</text>
  </g>
  <line x1="736" y1="196" x2="752" y2="196" stroke="#90b4ce" stroke-width="2" marker-end="url(#chain-arrow)"/>

  <!-- step 4: trait -->
  <g transform="translate(756 84)">
    <use href="#card"/>
    <text x="14" y="25" font-size="14.5" font-weight="700" fill="#094067">4  Trait</text>
    <text x="14" y="62" font-size="13.5" font-weight="700" fill="#094067">prostate carcinoma</text>
    <text x="14" y="80" font-size="11.5" fill="#5f6c7b">and 26 other traits</text>
    <use href="#yes" x="108" y="128"/><use href="#none" x="136" y="128"/><use href="#no" x="164" y="128"/>
    <use href="#yes" x="108" y="156"/><use href="#yes" x="136" y="156"/><use href="#no" x="164" y="156"/>
    <text x="14" y="215" font-size="13" font-weight="700" fill="#094067">an association</text>
  </g>

  <!-- legend -->
  <g font-size="12.5" fill="#5f6c7b">
    <use href="#yes" x="38" y="364"/><text x="52" y="368">supports</text>
    <use href="#no" x="128" y="364"/><text x="142" y="368">nothing found</text>
    <use href="#none" x="252" y="364"/><text x="266" y="368">no source</text>
    <text x="356" y="368"><tspan font-weight="700" fill="#094067">D</tspan> database</text>
    <text x="446" y="368"><tspan font-weight="700" fill="#094067">M</tspan> model prediction</text>
    <text x="584" y="368"><tspan font-weight="700" fill="#094067">L</tspan> literature</text>
  </g>
  <text x="930" y="368" font-size="12.5" font-weight="700" fill="#094067" text-anchor="end">Chains are ranked by their weakest link.</text>
</svg>
