<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" width="1100" height="600" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="The v8 workflow: code gathers evidence and screens TF families with QBiC-SELEX, the generator writes one chain per top family, the critic grades them and asks for up to three lookups, and code assigns link tiers, ranks the chains and gives the verdict.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5661"/>
    </marker>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a96a1"/>
    </marker>
    <style>
      .tag { font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em; }
      .head { font-size: 17px; font-weight: 600; fill: #16212b; }
      .title { font-size: 15px; font-weight: 600; fill: #16212b; }
      .body { font-size: 12.5px; fill: #2b3640; }
      .small { font-size: 11.5px; fill: #59656f; }
      .gen { fill: #e4eef8; stroke: #2c6aa0; }
      .crit { fill: #fbf0dc; stroke: #b07216; }
      .code { fill: #e5f2eb; stroke: #2f7a52; }
      .neutral { fill: #f3f5f7; stroke: #9aa6b1; }
      .gen-t { fill: #2c6aa0; } .crit-t { fill: #a0650f; } .code-t { fill: #2f7a52; } .neutral-t { fill: #5b6672; }
      .flow { stroke: #4a5661; stroke-width: 1.6; fill: none; }
      .bypass { stroke: #8a96a1; stroke-width: 1.4; stroke-dasharray: 5 4; fill: none; }
    </style>
  </defs>

  <rect x="1" y="1" width="1098" height="598" rx="16" fill="#ffffff" stroke="#d6dde1"/>
  <text class="head" x="30" y="40">variant2mechanism v8: code decides, the models write and critique</text>
  <rect class="code" x="742" y="27" width="14" height="14" rx="3"/>
  <text class="small" x="762" y="39">Code</text>
  <rect class="gen" x="812" y="27" width="14" height="14" rx="3"/>
  <text class="small" x="832" y="39">Generator model</text>
  <rect class="crit" x="938" y="27" width="14" height="14" rx="3"/>
  <text class="small" x="958" y="39">Critic model</text>

  <!-- Row 1: input, gather, screen, chains -->
  <rect class="neutral" x="30" y="70" width="175" height="200" rx="10"/>
  <text class="tag neutral-t" x="46" y="94">INPUT</text>
  <text class="body" x="46" y="120">A non-coding variant</text>
  <text class="body" x="46" y="138">A disease or trait</text>
  <text class="body" x="46" y="156">A cell context, or one</text>
  <text class="body" x="46" y="174">inferred by code</text>
  <text class="small" x="46" y="214" font-style="italic">e.g. rs339331,</text>
  <text class="small" x="46" y="231" font-style="italic">prostate cancer, LNCaP</text>

  <rect class="code" x="230" y="70" width="263" height="200" rx="10"/>
  <text class="tag code-t" x="246" y="94">CODE AND TOOLS</text>
  <text class="title" x="246" y="116">1 · Gather evidence</text>
  <text class="body" x="246" y="140">Ensembl VEP · cCRE registry</text>
  <text class="body" x="246" y="158">SCREEN downloads · ReMap ChIP</text>
  <text class="body" x="246" y="176">GWAS Catalog · Open Targets</text>
  <text class="body" x="246" y="194">GTEx eQTLs · PubTator3 papers</text>
  <rect x="246" y="206" width="231" height="50" rx="8" fill="#ffffff" stroke="#2f7a52" stroke-dasharray="4 3"/>
  <text class="small" x="258" y="226">Intake: the context and the</text>
  <text class="small" x="258" y="243">disease line, set by code</text>

  <rect class="code" x="518" y="70" width="263" height="200" rx="10"/>
  <text class="tag code-t" x="534" y="94">CODE</text>
  <text class="title" x="534" y="116">2 · Family screen</text>
  <rect x="534" y="128" width="231" height="56" rx="8" fill="#ffffff" stroke="#2f7a52" stroke-dasharray="4 3"/>
  <text class="body" x="546" y="149" font-weight="600">QBiC-SELEX</text>
  <text class="small" x="546" y="168">997 TF models, Bonferroni gate</text>
  <text class="body" x="534" y="206">Families ordered by ChIP grade</text>
  <text class="body" x="534" y="224">here, then anywhere, then |z|;</text>
  <text class="body" x="534" y="242">code names one member each</text>

  <rect class="gen" x="806" y="70" width="264" height="200" rx="10"/>
  <text class="tag gen-t" x="822" y="94">GENERATOR MODEL</text>
  <text class="title" x="822" y="116">3 · Chains</text>
  <text class="body" x="822" y="140">One chain per top-5 family:</text>
  <g font-size="11px" fill="#2c6aa0">
    <rect x="822" y="150" width="232" height="44" rx="6" fill="#ffffff" stroke="#9cc0e0"/>
    <text x="832" y="168">TF → allele → element →</text>
    <text x="832" y="185">gene → cell type → disease</text>
  </g>
  <text class="body" x="822" y="216">each link cites evidence IDs;</text>
  <text class="body" x="822" y="234">it may change the member or</text>
  <text class="body" x="822" y="252">family, and must say why</text>

  <path class="flow" d="M205,170 L228,170" marker-end="url(#arrow)"/>
  <path class="flow" d="M493,170 L516,170" marker-end="url(#arrow)"/>
  <path class="flow" d="M781,170 L804,170" marker-end="url(#arrow)"/>
  <path class="flow" d="M938,270 L938,328" marker-end="url(#arrow)"/>

  <!-- the code-only baseline skips steps 3 to 5 -->
  <path class="bypass" d="M650,270 L650,298 L362,298 L362,328" marker-end="url(#arrow-grey)"/>
  <text class="small" x="638" y="291" text-anchor="end">code-only baseline: code writes the chains, no model call</text>

  <!-- Row 2, right to left: critique, lookups, tiers, output -->
  <rect class="crit" x="806" y="330" width="264" height="190" rx="10"/>
  <text class="tag crit-t" x="822" y="354">CRITIC MODEL</text>
  <text class="title" x="822" y="376">4 · Critique</text>
  <text class="body" x="822" y="400">Grades every link: supported,</text>
  <text class="body" x="822" y="418">weak or missing; names problems;</text>
  <text class="body" x="822" y="436">asks for up to 3 lookups; may</text>
  <text class="body" x="822" y="454">propose eliminations</text>
  <text class="small" x="822" y="486">Its grades are shown in the report,</text>
  <text class="small" x="822" y="503">never used to rank</text>

  <rect class="code" x="518" y="330" width="263" height="190" rx="10"/>
  <text class="tag code-t" x="534" y="354">CODE AND TOOLS</text>
  <text class="title" x="534" y="376">5 · One round of lookups</text>
  <text class="body" x="534" y="400">Code checks the critic's lookups</text>
  <text class="body" x="534" y="418">and runs at most 3: ChIP, eQTL,</text>
  <text class="body" x="534" y="436">expression, gene-disease, papers</text>
  <text class="body crit-t" x="534" y="470" font-weight="600">then the critic regrades once</text>

  <rect class="code" x="230" y="330" width="263" height="190" rx="10"/>
  <text class="tag code-t" x="246" y="354">CODE</text>
  <text class="title" x="246" y="376">6 · Tiers and verdict</text>
  <text class="body" x="246" y="400">Each link gets a tier by fixed</text>
  <text class="body" x="246" y="418">rules, direct to contradicted.</text>
  <text class="body" x="246" y="436">Code eliminates, ranks, and</text>
  <text class="body" x="246" y="454">gives a verdict on three lines:</text>
  <text class="body" x="246" y="478" font-weight="600">TF · gene · disease → overall</text>

  <rect class="neutral" x="30" y="330" width="175" height="190" rx="10"/>
  <text class="tag neutral-t" x="46" y="354">OUTPUT</text>
  <text class="body" x="46" y="380">report.html: the</text>
  <text class="body" x="46" y="398">mechanism map</text>
  <text class="body" x="46" y="422">report.json: every</text>
  <text class="body" x="46" y="440">evidence row</text>
  <text class="body" x="46" y="464">trace.jsonl: each</text>
  <text class="body" x="46" y="482">model call</text>
  <text class="small" x="46" y="506" font-style="italic">v2m replay re-runs it</text>

  <path class="flow" d="M806,425 L783,425" marker-end="url(#arrow)"/>
  <path class="flow" d="M518,425 L495,425" marker-end="url(#arrow)"/>
  <path class="flow" d="M230,425 L207,425" marker-end="url(#arrow)"/>

  <text class="small" x="30" y="556">The models write and critique the chains; code assigns every tier, ranks the chains and gives the verdict. QBiC-SELEX predicts</text>
  <text class="small" x="30" y="573">in vitro binding only. Every evidence row has an ID (E01, E02, ...), and a citation of an ID not in the ledger is refused.</text>
</svg>
