<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="1100" height="650" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5661"/>
    </marker>
    <style>
      .tag { font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em; }
      .title { font-size: 15px; font-weight: 600; fill: #16212b; }
      .body { font-size: 12.5px; fill: #2b3640; }
      .small { font-size: 11.5px; fill: #59656f; }
      .gen { fill: #e4eef8; stroke: #2c6aa0; }
      .crit { fill: #fbf0dc; stroke: #b07216; }
      .code { fill: #e5f2eb; stroke: #2f7a52; }
      .neutral { fill: #f3f5f7; stroke: #9aa6b1; }
      .gen-t { fill: #2c6aa0; } .crit-t { fill: #a0650f; } .code-t { fill: #2f7a52; } .neutral-t { fill: #5b6672; }
      .flow { stroke: #4a5661; stroke-width: 1.6; fill: none; }
    </style>
  </defs>

  <rect x="1" y="1" width="1098" height="648" rx="16" fill="#ffffff" stroke="#d6dde1"/>

  <!-- Row 1: input, gather, draft, critique -->
  <rect class="neutral" x="30" y="80" width="170" height="160" rx="10"/>
  <text class="tag neutral-t" x="46" y="104">INPUT</text>
  <text class="body" x="46" y="130">A non-coding variant</text>
  <text class="body" x="46" y="149">A disease or trait</text>
  <text class="body" x="46" y="168">A cell context</text>
  <text class="small" x="46" y="198" font-style="italic">e.g. rs339331,</text>
  <text class="small" x="46" y="215" font-style="italic">prostate cancer, LNCaP</text>

  <rect class="code" x="230" y="60" width="310" height="200" rx="10"/>
  <text class="tag code-t" x="246" y="84">CODE AND TOOLS</text>
  <text class="title" x="246" y="106">1 · Gather evidence</text>
  <text class="body" x="246" y="130">Ensembl · ENCODE elements and ChIP-seq</text>
  <text class="body" x="246" y="148">GWAS Catalog · Open Targets fine-mapping</text>
  <text class="body" x="246" y="166">GTEx eQTLs · literature, quotes checked</text>
  <rect x="246" y="180" width="278" height="64" rx="8" fill="#ffffff" stroke="#2f7a52" stroke-dasharray="4 3"/>
  <text class="body" x="260" y="201" font-weight="600">QBiC-SELEX screen</text>
  <text class="small" x="260" y="219">997 TF binding models: whose binding</text>
  <text class="small" x="260" y="235">the variant changes, ChIP-bound TFs first</text>

  <rect class="gen" x="570" y="60" width="240" height="200" rx="10"/>
  <text class="tag gen-t" x="586" y="84">GENERATOR MODEL</text>
  <text class="title" x="586" y="106">2 · Draft</text>
  <text class="body" x="586" y="130">3 to 5 mechanism chains,</text>
  <text class="body" x="586" y="148">one of them "no TF effect"</text>
  <g font-size="11px" fill="#2c6aa0">
    <rect x="586" y="162" width="208" height="46" rx="6" fill="#ffffff" stroke="#9cc0e0"/>
    <text x="596" y="181">TF → allele → element →</text>
    <text x="596" y="199">gene → cell type → phenotype</text>
  </g>
  <text class="small" x="586" y="230">every link cites evidence IDs;</text>
  <text class="small" x="586" y="246">probabilities sum to 1</text>

  <rect class="crit" x="840" y="60" width="230" height="200" rx="10"/>
  <text class="tag crit-t" x="856" y="84">CRITIC MODEL</text>
  <text class="title" x="856" y="106">3 · Critique</text>
  <text class="body" x="856" y="130">Grades every link</text>
  <rect x="856" y="142" width="64" height="20" rx="4" fill="#dcefe3"/>
  <text x="888" y="156" font-size="10.5px" font-weight="600" fill="#276b44" text-anchor="middle">supported</text>
  <rect x="926" y="142" width="44" height="20" rx="4" fill="#f6e8cf"/>
  <text x="948" y="156" font-size="10.5px" font-weight="600" fill="#94590b" text-anchor="middle">weak</text>
  <rect x="976" y="142" width="56" height="20" rx="4" fill="#e8ecee"/>
  <text x="1004" y="156" font-size="10.5px" font-weight="600" fill="#5f6a73" text-anchor="middle">missing</text>
  <text class="body" x="856" y="188">with a written reason,</text>
  <text class="body" x="856" y="206">against the evidence only,</text>
  <text class="body" x="856" y="224">and suggests checks</text>

  <path class="flow" d="M200,160 L228,160" marker-end="url(#arrow)"/>
  <path class="flow" d="M540,160 L568,160" marker-end="url(#arrow)"/>
  <path class="flow" d="M810,160 L838,160" marker-end="url(#arrow)"/>

  <!-- Row 2: the refinement loop -->
  <rect x="30" y="300" width="870" height="230" rx="12" fill="#fbfcfd" stroke="#9aa6b1" stroke-dasharray="6 4"/>
  <text class="title" x="146" y="328">4 · Refine, up to 3 rounds</text>
  <text class="small" x="352" y="328">stops when the answer holds, a round brings nothing new, or after round 3</text>

  <path class="flow" d="M955,260 L955,282 L126,282 L126,348" marker-end="url(#arrow)"/>

  <rect class="gen" x="50" y="350" width="152" height="108" rx="9"/>
  <text class="tag gen-t" x="64" y="372">GENERATOR</text>
  <text class="title" x="64" y="393">Plan</text>
  <text class="small" x="64" y="413">up to 3 tool calls, each</text>
  <text class="small" x="64" y="429">naming the link it tests</text>
  <text class="small" x="64" y="445">and the result expected</text>

  <rect class="code" x="232" y="350" width="152" height="108" rx="9"/>
  <text class="tag code-t" x="246" y="372">CODE AND TOOLS</text>
  <text class="title" x="246" y="393">Act</text>
  <text class="small" x="246" y="413">checks each call,</text>
  <text class="small" x="246" y="429">refuses repeats,</text>
  <text class="small" x="246" y="445">runs the rest</text>

  <rect class="gen" x="414" y="350" width="152" height="108" rx="9"/>
  <text class="tag gen-t" x="428" y="372">GENERATOR</text>
  <text class="title" x="428" y="393">Revise</text>
  <text class="small" x="428" y="413">result vs expectation;</text>
  <text class="small" x="428" y="429">updates the chains</text>
  <text class="small" x="428" y="445">and probabilities</text>

  <rect class="crit" x="596" y="350" width="152" height="108" rx="9"/>
  <text class="tag crit-t" x="610" y="372">CRITIC</text>
  <text class="title" x="610" y="393">Regrade</text>
  <text class="small" x="610" y="413">grades every link again</text>
  <text class="small" x="610" y="429">and suggests the checks</text>
  <text class="small" x="610" y="445">for the next round</text>

  <path class="flow" d="M202,404 L230,404" marker-end="url(#arrow)"/>
  <path class="flow" d="M384,404 L412,404" marker-end="url(#arrow)"/>
  <path class="flow" d="M566,404 L594,404" marker-end="url(#arrow)"/>
  <path class="flow" d="M672,458 L672,478 L126,478 L126,460" marker-end="url(#arrow)"/>
  <text class="small" x="400" y="472" text-anchor="middle">the answer changed: next round</text>

  <text class="small" x="50" y="510">Tools: QBiC-SELEX for any TF · ChIP-seq (ENCODE, ReMap) · GTEx eQTLs · Open Targets · DepMap · Europe PMC</text>

  <path class="flow" d="M748,404 L916,404" marker-end="url(#arrow)"/>
  <text class="small" x="832" y="396" text-anchor="middle">stop</text>

  <rect class="code" x="918" y="330" width="160" height="170" rx="10"/>
  <text class="tag code-t" x="932" y="354">CODE</text>
  <text class="title" x="932" y="376">5 · Report</text>
  <text class="small" x="932" y="398">ranks the chains</text>
  <text class="small" x="932" y="416">checks every citation</text>
  <text class="small" x="932" y="434">prediction matrix</text>
  <text class="small" x="932" y="452">the cheapest experiment</text>
  <text class="small" x="932" y="468">that separates the</text>
  <text class="small" x="932" y="484">top two chains</text>

  <!-- The ledger: memory shared by every stage -->
  <rect x="30" y="552" width="1040" height="44" rx="10" fill="#eef1f4" stroke="#9aa6b1"/>
  <text class="body" x="550" y="579" text-anchor="middle"><tspan font-weight="600">Evidence ledger (memory):</tspan> every tool result gets an ID (E01, E02, …); every claim cites IDs; the planner sees every earlier call</text>

  <!-- Legend -->
  <g class="small">
    <rect class="gen" x="30" y="614" width="14" height="14" rx="3"/><text x="52" y="625">generator model</text>
    <rect class="crit" x="170" y="614" width="14" height="14" rx="3"/><text x="192" y="625">critic model</text>
    <rect class="code" x="290" y="614" width="14" height="14" rx="3"/><text x="312" y="625">code and tools (no model)</text>
    <text x="1070" y="625" text-anchor="end">Models: DeepSeek V4.1 Flash, GPT-6 Luna or Claude, through one client</text>
  </g>
</svg>
