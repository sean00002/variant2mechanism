<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img"
     aria-labelledby="loop-title loop-desc" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="loop-title">The loop: going back for evidence</title>
  <desc id="loop-desc">After the first reading the workflow looks at its own table. Code lists the gaps: a tie for
    first, a transcription factor and a gene that nothing joins, and the weakest claims. Code lists the searches that
    could close each gap. A planner model picks from that menu. Code runs the searches, and the reader and the joiner
    read the new articles. Code builds the table again and sees what changed. This repeats for up to three rounds and
    stops when a round changes nothing. The table that is kept is then built once by the one-pass code.</desc>
  <defs>
    <marker id="loop-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#90b4ce"/>
    </marker>
    <marker id="loop-back" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#094067"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="959" height="429" rx="14" fill="#fffffe" stroke="#d8eefe"/>
  <text x="30" y="40" font-size="18" font-weight="700" fill="#094067">The loop: going back for evidence</text>
  <text x="30" y="62" font-size="13" fill="#5f6c7b">After the first reading, the workflow reads its own table and searches again where the answer is weakest</text>

  <!-- legend -->
  <g font-size="12.5" fill="#5f6c7b">
    <circle cx="742" cy="35" r="7" fill="#3da9fc"/><text x="756" y="39.5">code</text>
    <circle cx="812" cy="35" r="7" fill="#ef4565"/><text x="826" y="39.5">a language model</text>
  </g>

  <!-- 1 Gaps: code -->
  <g transform="translate(30 84)">
    <rect width="164" height="168" rx="12" fill="#fffffe" stroke="#3da9fc" stroke-width="1.8"/>
    <circle cx="27" cy="30" r="14" fill="#3da9fc"/>
    <text x="27" y="35" font-size="14.5" font-weight="700" fill="#fffffe" text-anchor="middle">1</text>
    <text x="50" y="35.5" font-size="15.5" font-weight="700" fill="#094067">Gaps</text>
    <text x="16" y="64" font-size="10.5" font-weight="700" fill="#5f6c7b" letter-spacing="0.9">CODE</text>
    <g font-size="12.5" fill="#094067">
      <text x="16" y="90">Reads the table: a tie</text>
      <text x="16" y="109">for first, a TF and gene</text>
      <text x="16" y="128">that nothing joins, the</text>
      <text x="16" y="147">weakest claims.</text>
    </g>
  </g>
  <line x1="197" y1="168" x2="210" y2="168" stroke="#90b4ce" stroke-width="2" marker-end="url(#loop-arrow)"/>

  <!-- 2 Menu: code -->
  <g transform="translate(214 84)">
    <rect width="164" height="168" rx="12" fill="#fffffe" stroke="#3da9fc" stroke-width="1.8"/>
    <circle cx="27" cy="30" r="14" fill="#3da9fc"/>
    <text x="27" y="35" font-size="14.5" font-weight="700" fill="#fffffe" text-anchor="middle">2</text>
    <text x="50" y="35.5" font-size="15.5" font-weight="700" fill="#094067">Menu</text>
    <text x="16" y="64" font-size="10.5" font-weight="700" fill="#5f6c7b" letter-spacing="0.9">CODE</text>
    <g font-size="12.5" fill="#094067">
      <text x="16" y="90">Lists the searches that</text>
      <text x="16" y="109">could close each gap,</text>
      <text x="16" y="128">the same search for</text>
      <text x="16" y="147">every tied candidate.</text>
    </g>
  </g>
  <line x1="381" y1="168" x2="394" y2="168" stroke="#90b4ce" stroke-width="2" marker-end="url(#loop-arrow)"/>

  <!-- 3 Plan: the planner -->
  <g transform="translate(398 84)">
    <rect width="164" height="168" rx="12" fill="#fffffe" stroke="#ef4565" stroke-width="1.8"/>
    <circle cx="27" cy="30" r="14" fill="#ef4565"/>
    <text x="27" y="35" font-size="14.5" font-weight="700" fill="#fffffe" text-anchor="middle">3</text>
    <text x="50" y="35.5" font-size="15.5" font-weight="700" fill="#094067">Plan</text>
    <text x="16" y="64" font-size="10.5" font-weight="700" fill="#5f6c7b" letter-spacing="0.9">PLANNER</text>
    <g font-size="12.5" fill="#094067">
      <text x="16" y="90">Picks from the menu.</text>
      <text x="16" y="109">May name a TF or gene</text>
      <text x="16" y="128">from memory, as a</text>
      <text x="16" y="147">search term only.</text>
    </g>
  </g>
  <line x1="565" y1="168" x2="578" y2="168" stroke="#90b4ce" stroke-width="2" marker-end="url(#loop-arrow)"/>

  <!-- 4 Act: reader and joiner -->
  <g transform="translate(582 84)">
    <rect width="164" height="168" rx="12" fill="#fffffe" stroke="#ef4565" stroke-width="1.8"/>
    <circle cx="27" cy="30" r="14" fill="#ef4565"/>
    <text x="27" y="35" font-size="14.5" font-weight="700" fill="#fffffe" text-anchor="middle">4</text>
    <text x="50" y="35.5" font-size="15.5" font-weight="700" fill="#094067">Act</text>
    <text x="16" y="64" font-size="10.5" font-weight="700" fill="#5f6c7b" letter-spacing="0.9">READER, JOINER</text>
    <g font-size="12.5" fill="#094067">
      <text x="16" y="90">Code searches. The</text>
      <text x="16" y="109">reader reads each new</text>
      <text x="16" y="128">article, never told why</text>
      <text x="16" y="147">it was found.</text>
    </g>
  </g>
  <line x1="749" y1="168" x2="762" y2="168" stroke="#90b4ce" stroke-width="2" marker-end="url(#loop-arrow)"/>

  <!-- 5 Look: code -->
  <g transform="translate(766 84)">
    <rect width="164" height="168" rx="12" fill="#fffffe" stroke="#3da9fc" stroke-width="1.8"/>
    <circle cx="27" cy="30" r="14" fill="#3da9fc"/>
    <text x="27" y="35" font-size="14.5" font-weight="700" fill="#fffffe" text-anchor="middle">5</text>
    <text x="50" y="35.5" font-size="15.5" font-weight="700" fill="#094067">Look</text>
    <text x="16" y="64" font-size="10.5" font-weight="700" fill="#5f6c7b" letter-spacing="0.9">CODE</text>
    <g font-size="12.5" fill="#094067">
      <text x="16" y="90">Builds the table again,</text>
      <text x="16" y="109">keeps nothing, and</text>
      <text x="16" y="128">sees which cells and</text>
      <text x="16" y="147">ranks changed.</text>
    </g>
  </g>

  <!-- the way back -->
  <path d="M 848 254 V 286 H 112 V 258" fill="none" stroke="#094067" stroke-width="2" stroke-dasharray="5 4"
        marker-end="url(#loop-back)"/>
  <rect x="290" y="274" width="380" height="24" rx="12" fill="#094067"/>
  <text x="480" y="290.5" font-size="12" font-weight="700" fill="#fffffe" text-anchor="middle">up to 3 rounds; it stops when a round changes nothing</text>

  <!-- what can be searched -->
  <text x="30" y="330" font-size="10.5" font-weight="700" fill="#5f6c7b" letter-spacing="0.9">WHAT THE MENU HOLDS</text>
  <g font-size="12.5" fill="#094067">
    <rect x="30" y="340" width="150" height="26" rx="13" fill="#d8eefe"/><text x="105" y="357.5" text-anchor="middle">each tied TF or gene</text>
    <rect x="190" y="340" width="158" height="26" rx="13" fill="#d8eefe"/><text x="269" y="357.5" text-anchor="middle">a TF with its gene</text>
    <rect x="358" y="340" width="196" height="26" rx="13" fill="#d8eefe"/><text x="456" y="357.5" text-anchor="middle">other names of the variant</text>
    <rect x="564" y="340" width="158" height="26" rx="13" fill="#d8eefe"/><text x="643" y="357.5" text-anchor="middle">what a review cites</text>
    <rect x="732" y="340" width="198" height="26" rx="13" fill="#fffffe" stroke="#ef4565" stroke-width="1.4"/><text x="831" y="357.5" text-anchor="middle">a name the planner recalls</text>
  </g>

  <rect x="30" y="384" width="42" height="20" rx="10" fill="#094067"/>
  <text x="51" y="398" font-size="10.5" font-weight="700" fill="#fffffe" text-anchor="middle" letter-spacing="0.8">OUT</text>
  <text x="82" y="398.5" font-size="12.5" fill="#5f6c7b">The table that is kept is built once, by the one-pass code, over everything read: the order of rounds cannot change it.</text>
</svg>
