<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img"
     aria-labelledby="join-title join-desc" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="join-title">Joining claims into chains</title>
  <desc id="join-desc">Claims that share a name are joined into a chain. At rs12740374 the variant has claims about
    twelve groups of transcription factors and about the gene SORT1, so code builds a chain for every pair and
    twelve chains tie. Two experiments on file, read from the article that names the variant, changed a C/EBP
    factor and SORT1 expression changed. Those records join the C/EBP group to SORT1, and their chain comes first
    among the equal chains. The joiner looks for such experiments in articles that do not name the variant.</desc>
  <defs>
    <marker id="join-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#90b4ce"/>
    </marker>
    <marker id="join-first" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#094067"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="959" height="399" rx="14" fill="#fffffe" stroke="#d8eefe"/>
  <text x="30" y="40" font-size="18" font-weight="700" fill="#094067">Joining claims into chains</text>
  <text x="30" y="62" font-size="13" fill="#5f6c7b">Claims that share a name are joined. An experiment that ties a TF to a gene says which pair belongs together</text>

  <!-- column heads -->
  <g font-size="10.5" font-weight="700" fill="#5f6c7b" letter-spacing="0.9">
    <text x="30" y="172">THE VARIANT</text>
    <text x="212" y="108">CLAIMS ABOUT A TF</text>
    <text x="544" y="258">CLAIMS ABOUT A GENE</text>
    <text x="788" y="172">THE TRAIT</text>
  </g>

  <!-- every pairing code makes: thin lines -->
  <g stroke="#90b4ce" stroke-width="1.4" fill="none">
    <line x1="130" y1="214" x2="212" y2="146"/>
    <line x1="130" y1="214" x2="212" y2="214"/>
    <line x1="130" y1="214" x2="212" y2="282"/>
    <line x1="402" y1="214" x2="544" y2="214"/>
    <line x1="402" y1="282" x2="544" y2="214"/>
    <line x1="696" y1="214" x2="784" y2="214" marker-end="url(#join-arrow)"/>
  </g>

  <!-- the joined chain: thick -->
  <g stroke="#094067" stroke-width="3" fill="none">
    <line x1="130" y1="214" x2="208" y2="149" marker-end="url(#join-first)"/>
    <path d="M 402 146 C 470 146, 480 214, 540 214" marker-end="url(#join-first)"/>
  </g>
  <!-- the join itself -->
  <path d="M 402 134 C 420 128, 430 122, 440 118" fill="none" stroke="#ef4565" stroke-width="2" stroke-dasharray="6 4"/>
  <path d="M 590 138 C 596 156, 604 172, 612 188" fill="none" stroke="#ef4565" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="440" y="92" width="270" height="46" rx="10" fill="#fffffe" stroke="#ef4565" stroke-width="1.4"/>
  <text x="452" y="111" font-size="11" font-weight="700" fill="#ef4565" letter-spacing="0.8">A JOIN, READ FROM AN ARTICLE</text>
  <text x="452" y="128" font-size="12.5" fill="#094067">a C/EBP factor is changed, SORT1 changes</text>

  <!-- the variant -->
  <rect x="30" y="184" width="100" height="60" rx="30" fill="#094067"/>
  <text x="80" y="210" font-size="13.5" font-weight="700" fill="#fffffe" text-anchor="middle">rs12740374</text>
  <text x="80" y="228" font-size="12" fill="#d8eefe" text-anchor="middle">G or T</text>

  <!-- TF candidates -->
  <g>
    <rect x="212" y="122" width="190" height="48" rx="10" fill="#d8eefe" stroke="#094067" stroke-width="2"/>
    <text x="226" y="143" font-size="13.5" font-weight="700" fill="#094067">C/EBP group</text>
    <text x="226" y="160" font-size="11.5" fill="#5f6c7b">CEBPA, CEBPB, CEBPE</text>
    <rect x="212" y="190" width="190" height="48" rx="10" fill="#fffffe" stroke="#90b4ce" stroke-width="1.5"/>
    <text x="226" y="211" font-size="13.5" font-weight="700" fill="#094067">AP-2 group</text>
    <text x="226" y="228" font-size="11.5" fill="#5f6c7b">TFAP2A, TFAP2B, TFAP2C ...</text>
    <rect x="212" y="258" width="190" height="48" rx="10" fill="#fffffe" stroke="#90b4ce" stroke-width="1.5"/>
    <text x="226" y="279" font-size="13.5" font-weight="700" fill="#094067">10 more TF groups</text>
    <text x="226" y="296" font-size="11.5" fill="#5f6c7b">each with the same evidence</text>
  </g>

  <!-- the gene -->
  <rect x="544" y="190" width="152" height="48" rx="10" fill="#d8eefe" stroke="#094067" stroke-width="2"/>
  <text x="558" y="211" font-size="13.5" font-weight="700" fill="#094067">SORT1</text>
  <text x="558" y="228" font-size="11.5" fill="#5f6c7b">its RNA differs by allele</text>

  <!-- the trait -->
  <rect x="788" y="184" width="142" height="60" rx="30" fill="#094067"/>
  <text x="859" y="210" font-size="13.5" font-weight="700" fill="#fffffe" text-anchor="middle">LDL cholesterol</text>
  <text x="859" y="228" font-size="12" fill="#d8eefe" text-anchor="middle">and other traits</text>

  <!-- what it means -->
  <g font-size="12.5" fill="#5f6c7b">
    <rect x="30" y="330" width="60" height="20" rx="10" fill="#90b4ce"/>
    <text x="60" y="344" font-size="10.5" font-weight="700" fill="#fffffe" text-anchor="middle" letter-spacing="0.8">BEFORE</text>
    <text x="100" y="344.5">Code pairs every TF with every gene. Twelve chains hold the same kinds of evidence, so they tie.</text>
    <rect x="30" y="358" width="60" height="20" rx="10" fill="#094067"/>
    <text x="60" y="372" font-size="10.5" font-weight="700" fill="#fffffe" text-anchor="middle" letter-spacing="0.8">AFTER</text>
    <text x="100" y="372.5">The joined chain comes first. A join only breaks ties: it never outranks stronger evidence on a link.</text>
  </g>
</svg>
